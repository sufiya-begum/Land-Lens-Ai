<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ILRDVS · Intelligent Land Record Digitization &amp; Validation System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  :root{
    --blue-900:#1e3a8a; --blue-800:#1e40af; --blue-700:#1d4ed8; --blue-600:#2563eb; --blue-500:#3b82f6;
    --blue-100:#dbeafe; --blue-50:#eff6ff;
    --slate-900:#0f172a; --slate-800:#1e293b; --slate-700:#334155; --slate-600:#475569; --slate-500:#64748b;
    --slate-400:#94a3b8; --slate-300:#cbd5e1; --slate-200:#e2e8f0; --slate-100:#f1f5f9; --slate-50:#f8fafc;
    --emerald-600:#059669; --emerald-500:#10b981; --emerald-50:#ecfdf5; --emerald-200:#a7f3d0;
    --amber-600:#d97706; --amber-500:#f59e0b; --amber-50:#fffbeb; --amber-200:#fde68a;
    --red-600:#dc2626; --red-500:#ef4444; --red-50:#fef2f2; --red-200:#fecaca;
    --orange-600:#ea580c; --orange-500:#f97316; --orange-50:#fff7ed; --orange-200:#fed7aa;
    --radius:10px;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--slate-50); color:var(--slate-900); -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--blue-100);}

  /* ---------- utility ---------- */
  .flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
  .gap-1{gap:4px;} .gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;}
  .grid{display:grid;} .w-full{width:100%;}
  .muted{color:var(--slate-500);} .small{font-size:12px;}
  .icon{width:16px;height:16px;flex-shrink:0;}
  .icon-lg{width:22px;height:22px;}
  .icon-xl{width:32px;height:32px;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .pulse{animation:pulse 1.4s ease-in-out infinite;}
  @keyframes popin{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;
    font-size:13.5px;font-weight:600;padding:10px 16px;border:1px solid transparent;transition:.15s;white-space:nowrap;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--blue-700);color:#fff;box-shadow:var(--shadow);}
  .btn-primary:hover:not(:disabled){background:var(--blue-800);}
  .btn-secondary{background:#fff;color:var(--slate-700);border-color:var(--slate-300);box-shadow:var(--shadow);}
  .btn-secondary:hover:not(:disabled){background:var(--slate-50);}
  .btn-danger-text{background:transparent;color:var(--red-600);}
  .btn-danger-text:hover{background:var(--red-50);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 10px;font-size:12.5px;}

  /* ---------- cards / tables / badges ---------- */
  .card{background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius);box-shadow:var(--shadow);}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid;padding:4px 10px;font-size:11.5px;font-weight:600;}
  .dot{width:6px;height:6px;border-radius:50%;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate-400);
     background:var(--slate-50);padding:12px 18px;border-bottom:1px solid var(--slate-100);font-weight:600;}
  td{padding:13px 18px;border-bottom:1px solid var(--slate-100);color:var(--slate-700);}
  tr.rowlink{cursor:pointer;}
  tr.rowlink:hover td{background:var(--slate-50);}
  .table-wrap{overflow-x:auto;}

  input[type=text],input[type=email],input[type=password],select.field{
    width:100%;border:1px solid var(--slate-300);border-radius:8px;padding:9px 12px;font-size:13.5px;
    outline:none;transition:.15s;background:#fff;color:var(--slate-800);
  }
  input[type=text]:focus,input[type=email]:focus,input[type=password]:focus,select.field:focus{
    border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(59,130,246,.15);
  }
  label.field-label{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--slate-600);margin-bottom:6px;}

  /* ---------- landing ---------- */
  .landing-header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--slate-200);}
  .landing-hero{background:linear-gradient(180deg,var(--blue-50),#fff 70%);border-bottom:1px solid var(--slate-200);}
  .brand-badge{width:36px;height:36px;border-radius:8px;background:var(--blue-700);color:#fff;display:flex;align-items:center;justify-content:center;}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--blue-100);background:var(--blue-50);color:var(--blue-700);
    border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;}
  .step-node{width:38px;height:38px;border-radius:50%;border:2px solid var(--blue-600);background:var(--blue-50);
    color:var(--blue-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step-line{width:2px;flex:1;background:var(--blue-100);margin:0 auto;min-height:26px;}
  .feature-icon{width:40px;height:40px;border-radius:8px;background:var(--blue-50);color:var(--blue-700);display:flex;align-items:center;justify-content:center;}

  /* ---------- login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--slate-50);padding:24px;}
  .login-card{width:100%;max-width:900px;background:#fff;border:1px solid var(--slate-200);border-radius:16px;overflow:hidden;
    box-shadow:0 8px 30px rgba(15,23,42,.08);display:grid;grid-template-columns:1fr;}
  .login-side{background:var(--blue-700);color:#fff;padding:36px;display:none;flex-direction:column;justify-content:space-between;}
  .login-main{padding:34px;}
  @media(min-width:900px){ .login-card{grid-template-columns:2fr 3fr;} .login-side{display:flex;} }
  .demo-btn{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--slate-200);background:#fff;
    border-radius:8px;padding:10px 12px;text-align:left;font-size:12px;box-shadow:var(--shadow);width:100%;}
  .demo-btn:hover{border-color:var(--blue-300, #93c5fd);background:var(--blue-50);}

  /* ---------- app shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:270px;background:#fff;border-right:1px solid var(--slate-200);
    display:flex;flex-direction:column;z-index:50;transition:transform .2s ease;}
  .sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--slate-200);}
  .sidebar-nav{flex:1;overflow-y:auto;padding:16px 12px;}
  .nav-section-label{padding:0 10px 6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-400);}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;border-radius:8px;padding:10px 12px;font-size:13.5px;
    font-weight:500;color:var(--slate-600);background:transparent;border:none;text-align:left;margin-bottom:2px;}
  .nav-item:hover{background:var(--slate-50);color:var(--slate-900);}
  .nav-item.active{background:var(--blue-50);color:var(--blue-700);}
  .nav-item.active .icon{color:var(--blue-700);}
  .nav-item .icon{color:var(--slate-400);}
  .sidebar-foot{padding:14px;border-top:1px solid var(--slate-200);}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:40;display:none;}
  .main-col{flex:1;display:flex;flex-direction:column;min-height:100vh;margin-left:270px;}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--slate-200);padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .hamburger{display:none;background:none;border:none;color:var(--slate-500);padding:4px;}
  .main-content{flex:1;padding:22px;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--blue-700);color:#fff;font-size:11.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .search-box{position:relative;width:230px;}
  .search-box input{padding-left:32px;}
  .search-box .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--slate-400);}
  @media(max-width:1024px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-overlay.open{display:block;}
    .main-col{margin-left:0;}
    .hamburger{display:inline-flex;}
    .search-box{display:none;}
  }

  .section-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;}
  .eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--blue-600);margin:0 0 4px;}
  .page-title{font-size:22px;font-weight:800;margin:0;color:var(--slate-900);}
  .page-sub{font-size:13.5px;color:var(--slate-500);margin:4px 0 0;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.stat-grid{grid-template-columns:1fr;}}
  .stat-card{padding:18px;}
  .stat-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .stat-value{font-size:24px;font-weight:800;margin:14px 0 2px;color:var(--slate-900);}

  .conf-bar-track{height:6px;width:100px;border-radius:999px;background:var(--slate-100);overflow:hidden;}
  .conf-bar-fill{height:6px;border-radius:999px;transition:width .5s ease;}

  .upload-drop{border:2px dashed var(--slate-300);border-radius:12px;padding:44px 20px;text-align:center;background:var(--slate-50);transition:.15s;}
  .upload-drop.drag{border-color:var(--blue-500);background:var(--blue-50);}
  .stage-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:20px;}
  .stage-node{width:32px;height:32px;border-radius:50%;border:2px solid var(--slate-200);background:#fff;color:var(--slate-300);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:0 auto 6px;transition:.2s;}
  .stage-node.done{border-color:var(--emerald-500);background:var(--emerald-500);color:#fff;}
  .stage-node.active{border-color:var(--blue-600);background:var(--blue-600);color:#fff;}

  .toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{display:flex;align-items:center;gap:8px;border:1px solid;border-radius:8px;padding:12px 16px;font-size:13px;font-weight:600;
    box-shadow:0 10px 25px rgba(15,23,42,.12);animation:fadein .2s ease;background:#fff;max-width:320px;}
  .toast-success{border-color:var(--emerald-200);background:var(--emerald-50);color:#065f46;}
  .toast-warning{border-color:var(--amber-200);background:var(--amber-50);color:#92400e;}
  .toast-error{border-color:var(--red-200);background:var(--red-50);color:#991b1b;}
  .toast-info{border-color:var(--blue-100);background:var(--blue-50);color:#1e40af;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal-box{background:#fff;border-radius:14px;width:100%;max-width:460px;box-shadow:0 20px 50px rgba(15,23,42,.25);animation:popin .15s ease;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--slate-100);}
  .modal-body{padding:20px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--slate-100);}

  .checkline{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--slate-200);border-radius:8px;padding:11px 14px;font-size:13px;color:var(--slate-600);}
  .fade-in{animation:fadein .25s ease;}
</style>
</head>

        '<p style="font-size:13px;line-height:1.6;color:#dbeafe;margin:0;">All logins are recorded in the audit log. Use your issued credentials to access digitization, validation, and reporting tools.</p>'+
      '</div>'+
      '<div style="font-size:13px;color:#dbeafe;">'+

        '<div class="flex items-center gap-2">'+icon("scroll")+' Full activity audit trail</div>'+
      '</div>'+
    '</div>'+
    '<div class="login-main">'+
      '<button onclick="goTo(\'landing\')" class="flex items-center gap-1 small muted" style="background:none;border:none;margin-bottom:18px;padding:0;">'+icon("arrowleft")+' Back to home</button>'+
      '<h1 style="font-size:22px;font-weight:800;margin:0;">Sign in to your account</h1>'+
      '<p class="small muted" style="margin:6px 0 22px;">Enter your credentials to access the ILRDVS portal.</p>'+
      '<form onsubmit="submitLogin(event)">'+
        '<label class="field-label">Email address</label>'+
        '<input type="text" id="loginEmail" placeholder="you@example.com" style="margin-bottom:14px;" required/>'+
        '<label class="field-label">Password</label>'+
        '<input type="password" id="loginPassword" placeholder="••••••••" style="margin-bottom:14px;" required/>'+
        (LOGIN_ERROR ? '<div class="flex items-center gap-2 small" style="border:1px solid var(--red-200);background:var(--red-50);color:#b91c1c;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-weight:600;">'+icon("info")+esc(LOGIN_ERROR)+'</div>' : '')+
        '<button type="submit" class="btn btn-primary btn-block" style="padding:12px;">Sign In '+icon("arrowright")+'</button>'+
      '</form>'+
      '<div class="card" style="background:var(--slate-50);margin-top:22px;padding:16px;">'+
        '<p class="small" style="text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--slate-500);margin:0 0 10px;">Demo credentials</p>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'+
          '<button type="button" class="demo-btn" onclick="fillDemo(\'admin\')"><span><span style="display:block;font-weight:700;color:var(--slate-800);">Admin</span><span class="muted">admin@example.com</span></span>'+icon("user")+'</button>'+
          '<button type="button" class="demo-btn" onclick="fillDemo(\'officer\')"><span><span style="display:block;font-weight:700;color:var(--slate-800);">Land Officer</span><span class="muted">officer@example.com</span></span>'+icon("user")+'</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
  '</div></div>';
}
function fillDemo(role){
  document.getElementById("loginEmail").value = role==="admin" ? "admin@example.com" : "officer@example.com";
  document.getElementById("loginPassword").value = role==="admin" ? "admin123" : "officer123";
}
window.fillDemo = fillDemo;
function submitLogin(e){
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim().toLowerCase();
  const pw = document.getElementById("loginPassword").value;
  const match = USERS.find(function(u){ return u.email.toLowerCase()===email && u.password===pw; });
  if(match){
    LOGIN_ERROR="";
    S.auth = match;
    logAudit("User Login", match.name+" signed in to the portal");
    showToast("Welcome back, "+match.name+".","success");
    goTo("dashboard");
  } else {
    LOGIN_ERROR = "Invalid email or password. Try one of the demo accounts below.";
    render();
  }
}
window.submitLogin = submitLogin;

    {label:"Total Records", value:total, icon:"files", bg:"var(--blue-50)", fg:"var(--blue-700)"},
    {label:"Verified", value:verified, icon:"checkcircle", bg:"var(--emerald-50)", fg:"#047857"},

    '<div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:18px;" class="dash-row1">'+
      '<div class="card" style="padding:20px;"><p style="font-weight:700;font-size:14px;margin:0 0 2px;">Monthly Upload Volume</p><p class="small muted" style="margin:0 0 14px;">Documents submitted for digitization</p>'+
      '<div style="height:230px;"><canvas id="chartMonthly"></canvas></div></div>'+

          return '<div class="flex items-center justify-between small" style="margin-bottom:5px;"><span class="flex items-center gap-1" style="color:var(--slate-500);"><span class="dot" style="background:'+x[1]+'"></span>'+x[0]+'</span><span style="font-weight:700;color:var(--slate-700);">'+x[2]+'</span></div>';
        }).join('')+

function buildDashboardCharts(){
  ["chartMonthly","chartStatus","chartDistrict"].forEach(function(id){ if(CHARTS[id]){CHARTS[id].destroy(); delete CHARTS[id];} });
  const monthlyEl = document.getElementById("chartMonthly");
  if(monthlyEl){
    CHARTS.chartMonthly = new Chart(monthlyEl, { type:"line",
      data:{ labels:["Jan","Feb","Mar","Apr","May"], datasets:[{ label:"Uploads", data:[62,74,88,95,112], borderColor:"#1d4ed8", backgroundColor:"rgba(29,78,216,.08)", fill:true, tension:.35, pointBackgroundColor:"#1d4ed8" }] },
      options:{ plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:"#f1f5f9"} }, x:{ grid:{display:false} } }, maintainAspectRatio:false }
    });
  }
  const statusEl = document.getElementById("chartStatus");
  if(statusEl){
    const verified=RECORDS.filter(function(r){return r.status==="Verified";}).length;
    const pending=RECORDS.filter(function(r){return r.status==="Pending";}).length;
    const manual=RECORDS.filter(function(r){return r.status==="Manual Verification";}).length;
    const errors=RECORDS.filter(function(r){return r.status==="Error";}).length;
    CHARTS.chartStatus = new Chart(statusEl, { type:"doughnut",
      data:{ labels:["Verified","Pending","Manual Verification","Error"], datasets:[{ data:[verified,pending,manual,errors], backgroundColor:["#059669","#d97706","#ea580c","#dc2626"], borderWidth:0 }] },
      options:{ plugins:{legend:{display:false}}, cutout:"65%", maintainAspectRatio:false }
    });
  }
  const districtEl = document.getElementById("chartDistrict");
  if(districtEl){
    CHARTS.chartDistrict = new Chart(districtEl, { type:"bar",
      data:{ labels:DISTRICTS.map(function(d){return d.replace(" Godavari"," Godav.");}), datasets:[{ data:DISTRICTS.map(function(d){return RECORDS.filter(function(r){return r.district===d;}).length;}), backgroundColor:"#2563eb", borderRadius:4, maxBarThickness:34 }] },
      options:{ plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:"#f1f5f9"}, ticks:{precision:0} }, x:{ grid:{display:false} } }, maintainAspectRatio:false }
    });
  }
}

const STAGES_REAL = ["Uploading","Reading Document","OCR Processing","Extracting Fields","Completed"];
const STAGES_DEMO = ["Uploading","OCR Processing","Extracting Fields","Validating","Completed"];
function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

function renderUpload(){
  const up = S.upload;
  return '<div class="section-head"><div><p class="eyebrow">Digitization Workflow · Step 1</p><h1 class="page-title">Upload Land Record</h1><p class="page-sub">Submit a scanned land deed to begin OCR extraction and validation.</p></div></div>'+

  '<div class="flex gap-2" style="margin-bottom:16px;flex-wrap:wrap;">'+
    '<button onclick="setUploadMode(\'real\')" style="border:1px solid '+(S.uploadMode==="real"?"var(--blue-600)":"var(--slate-200)")+';background:'+(S.uploadMode==="real"?"var(--blue-700)":"#fff")+';color:'+(S.uploadMode==="real"?"#fff":"var(--slate-600)")+';border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;">'+icon("scan")+' Real Document Processing</button>'+
    '<button onclick="setUploadMode(\'demo\')" style="border:1px solid '+(S.uploadMode==="demo"?"var(--blue-600)":"var(--slate-200)")+';background:'+(S.uploadMode==="demo"?"var(--blue-700)":"#fff")+';color:'+(S.uploadMode==="demo"?"#fff":"var(--slate-600)")+';border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;">'+icon("layers")+' Demo Scenario</button>'+
  '</div>'+

  (S.uploadMode==="real" ? renderRealUploadPanel(up) : renderDemoUploadPanel(up))+
  '<style>@media(max-width:900px){.upload-grid{grid-template-columns:1fr !important;}}</style>';
}

function renderRealUploadPanel(up){
  return '<div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;" class="upload-grid">'+
    '<div class="card" style="padding:24px;">'+
      '<div class="pill" style="margin-bottom:16px;">'+icon("checkcircle")+' Real Document Processing — the file you upload is actually read and OCR\u2019d</div>'+

      '<div class="upload-drop'+(up.dragOver?' drag':'')+'" id="dropZone" ondragover="onRealDragOver(event)" ondragleave="onRealDragLeave(event)" ondrop="onRealDrop(event)">'+
        '<div style="width:56px;height:56px;border-radius:50%;background:var(--blue-100);color:var(--blue-700);display:flex;align-items:center;justify-content:center;margin:0 auto;">'+icon("upload","icon-lg")+'</div>'+
        '<p style="font-weight:700;font-size:13.5px;margin:14px 0 2px;">Drag &amp; drop your actual land record here</p>'+
        '<p class="small muted" style="margin:0 0 14px;">PDF (digital or scanned), JPG, or PNG · Max ~10MB · Processed entirely in your browser</p>'+
        '<label class="btn btn-secondary btn-sm" style="display:inline-flex;">Browse Files<input type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.bmp,application/pdf,image/*" style="display:none;" onchange="onRealFileInput(this.files[0])"/></label>'+
      '</div>'+

      (up.fileName ? '<div class="flex items-center gap-3 card" style="padding:12px 14px;margin-top:18px;">'+
        '<div style="width:36px;height:36px;border-radius:8px;background:var(--blue-50);color:var(--blue-700);display:flex;align-items:center;justify-content:center;">'+icon("file")+'</div>'+
        '<div style="flex:1;min-width:0;"><p style="margin:0;font-weight:700;font-size:13px;word-break:break-all;">'+esc(up.fileName)+'</p><p class="small muted" style="margin:0;">'+(up.file?Math.max(1,Math.round(up.file.size/1024))+" KB · Ready to process":"Ready to process")+'</p></div>'+
        (!up.running ? '<button style="background:none;border:none;color:var(--slate-400);" onclick="clearRealFile()">'+icon("x")+'</button>' : '')+
      '</div>' : '')+

      (up.error ? '<div class="flex items-start gap-2 small" style="border:1px solid var(--red-200);background:var(--red-50);color:#b91c1c;border-radius:8px;padding:12px;margin-top:16px;font-weight:600;">'+icon("info")+esc(up.error)+'</div>' : '')+

      (up.stageIdx>=0 ? (function(){
        var pct = up.progress;
        var label = up.stageLabel || STAGES_REAL[up.stageIdx];
        var html = '<div style="margin-top:22px;"><div class="flex items-center justify-between small" style="margin-bottom:8px;"><span style="font-weight:700;color:var(--slate-500);">'+esc(label)+'…</span><span style="font-weight:700;color:var(--blue-700);">'+pct+'%</span></div>'+
        '<div style="height:8px;border-radius:999px;background:var(--slate-100);overflow:hidden;"><div style="height:8px;border-radius:999px;background:var(--blue-600);width:'+pct+'%;transition:width .15s;"></div></div>'+
        '<div class="stage-grid">'+STAGES_REAL.map(function(s,i){
          var cls = i<up.stageIdx ? "done" : (i===up.stageIdx ? "active pulse" : "");
          return '<div style="text-align:center;"><div class="stage-node '+cls+'">'+(i<up.stageIdx?icon("check"):(i+1))+'</div><p class="small" style="margin:0;font-size:10px;font-weight:600;color:'+(i<=up.stageIdx?"var(--slate-700)":"var(--slate-300)")+';">'+s+'</p></div>';
        }).join('')+'</div>';
        if(up.stageIdx===STAGES_REAL.length-1){
          html += '<p class="flex items-center justify-center gap-1 small" style="color:#047857;font-weight:700;margin-top:16px;">'+icon("checkcircle")+' Processing complete — opening extracted data…</p>';
        }
        html += '</div>';
        return html;
      })() : '')+

      (!up.running ? '<button class="btn btn-primary btn-block" style="margin-top:22px;padding:12px;" '+(!up.file?'disabled':'')+' onclick="startRealProcessing()">'+icon("scan")+' Start Real OCR Processing</button>' : '')+
    '</div>'+

    '<div>'+
      '<div class="card" style="padding:18px;margin-bottom:16px;"><p style="font-weight:700;font-size:13.5px;margin:0 0 10px;">How this works</p>'+
        [
          ["file","Digital PDFs: text layer is read directly with PDF.js — no OCR guessing needed."],
          ["scan","Scanned PDFs / images: pages are OCR\u2019d in-browser with Tesseract.js."],
          ["clipboardcheck","Fields are then pulled from the recognized text and shown for your review."]
        ].map(function(t){
          return '<div class="flex gap-2 small" style="color:var(--slate-500);margin-bottom:10px;">'+icon(t[0],"icon")+t[1]+'</div>';
        }).join('')+
      '</div>'+
      '<div class="card" style="padding:18px;"><p style="font-weight:700;font-size:13.5px;margin:0 0 10px;">Tips for best OCR results</p>'+
        ['Scan at 300 DPI or higher','Ensure all four corners are visible','Avoid glare and shadows on the document','Typed/printed text OCRs far more accurately than handwriting'].map(function(t){
          return '<div class="flex gap-2 small" style="color:var(--slate-500);margin-bottom:8px;">'+icon("checkcircle","icon")+t+'</div>';
        }).join('')+
      '</div>'+
    '</div>'+
  '</div>';
}

function renderDemoUploadPanel(up){

  return '<div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;" class="upload-grid">'+
    '<div class="card" style="padding:24px;">'+
      '<div class="pill" style="margin-bottom:16px;background:var(--slate-100);border-color:var(--slate-200);color:var(--slate-600);">'+icon("layers")+' Demo Scenario — simulated OCR using pre-written sample data, no real file is read</div>'+
      '<div class="upload-drop">'+
        '<div style="width:56px;height:56px;border-radius:50%;background:var(--blue-100);color:var(--blue-700);display:flex;align-items:center;justify-content:center;margin:0 auto;">'+icon("upload","icon-lg")+'</div>'+
        '<p style="font-weight:700;font-size:13.5px;margin:14px 0 2px;">Simulated document</p>'+
        '<p class="small muted" style="margin:0 0 14px;">Pick a scenario on the right, then load its sample document below.</p>'+
        '<button class="btn btn-secondary btn-sm" onclick="onDemoFilePicked(\''+esc(sc.fileName)+'\')">Use sample document for '+sc.label+'</button>'+
      '</div>'+

/* Parse labelled fields out of raw recognized text, with a confidence baseline (0-100) */
function parseFieldsFromText(rawText, baseline){
  const fields={}, confidence={};
  Object.keys(FIELD_LABELS).forEach(function(key){
    const pattern = FIELD_PATTERNS[key];
    let value="";
    if(pattern){
      const m = rawText.match(pattern);
      if(m && m[1]) value = m[1].trim().replace(/[\s,;:]+$/,"");
    }
    fields[key]=value;
    if(value){
      const jitter = Math.round((Math.random()*6)-3);
      confidence[key] = Math.max(35, Math.min(99, baseline+jitter));
    } else {
      confidence[key] = 0;
    }
  });
  const confs = Object.values(confidence);
  const avg = Math.round(confs.reduce(function(a,b){return a+b;},0)/confs.length);
  return { fields:fields, confidence:confidence, avgConfidence:avg };
}

async function startRealProcessing(){
  if(!S.upload.file) return;
  clearUploadTimers();
  const file = S.upload.file;
  S.upload.running=true; S.upload.error=""; S.upload.stageIdx=0; S.upload.stageLabel="Uploading"; S.upload.progress=8;
  render();
  try{
    await sleep(350);
    S.upload.stageIdx=1; S.upload.stageLabel="Reading Document"; S.upload.progress=18; render();

    const isPdf = file.type==="application/pdf" || /\.pdf$/i.test(file.name);
    const isImage = file.type.indexOf("image/")===0 || /\.(png|jpe?g|bmp|webp|tiff?)$/i.test(file.name);
    if(!isPdf && !isImage) throw new Error("Unsupported file type. Please upload a PDF, JPG, or PNG land record.");

    let rawText = "";
    let engine = "";
    let baseline = 70;

    if(isPdf){
      if(typeof pdfjsLib==="undefined") throw new Error("The PDF engine failed to load (check your internet connection) — try again, or use Demo Scenario mode.");
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:buf}).promise;
      let textParts=[];
      for(let p=1;p<=pdf.numPages;p++){
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        textParts.push(content.items.map(function(it){return it.str;}).join(" "));
      }
      rawText = textParts.join("\n").trim();

      if(rawText.replace(/\s/g,"").length < 25){
        S.upload.stageIdx=2; S.upload.stageLabel="OCR Processing (scanned PDF)"; S.upload.progress=32; render();
        if(typeof Tesseract==="undefined") throw new Error("The OCR engine failed to load (check your internet connection) — try again, or use Demo Scenario mode.");
        const worker = await Tesseract.createWorker('eng', 1, { logger:function(m){
          if(m.status==="recognizing text"){ S.upload.progress = 32 + Math.round(m.progress*55); render(); }
        }});
        const maxPages = Math.min(pdf.numPages, 3);
        let ocrParts=[]; let confs=[];
        for(let p=1;p<=maxPages;p++){
          const page = await pdf.getPage(p);
          const viewport = page.getViewport({scale:2});
          const canvas = document.createElement("canvas");
          canvas.width=viewport.width; canvas.height=viewport.height;
          const ctx = canvas.getContext("2d");
          await page.render({canvasContext:ctx, viewport:viewport}).promise;
          const res = await worker.recognize(canvas);
          ocrParts.push(res.data.text || "");
          confs.push(res.data.confidence || 0);
        }
        await worker.terminate();
        rawText = ocrParts.join("\n").trim();
        baseline = confs.length ? Math.round(confs.reduce(function(a,b){return a+b;},0)/confs.length) : 55;
        engine = "Tesseract.js OCR (scanned PDF pages)";
      } else {
        engine = "PDF.js text layer (digital PDF)";
        baseline = 99;
        S.upload.stageIdx=2; S.upload.stageLabel="OCR Processing"; S.upload.progress=90; render();
        await sleep(250);
      }
    } else {
      S.upload.stageIdx=2; S.upload.stageLabel="OCR Processing"; S.upload.progress=28; render();
      if(typeof Tesseract==="undefined") throw new Error("The OCR engine failed to load (check your internet connection) — try again, or use Demo Scenario mode.");
      const worker = await Tesseract.createWorker('eng', 1, { logger:function(m){
        if(m.status==="recognizing text"){ S.upload.progress = 28 + Math.round(m.progress*62); render(); }
      }});
      const res = await worker.recognize(file);
      await worker.terminate();
      rawText = (res.data.text||"").trim();
      baseline = Math.round(res.data.confidence || 60);
      engine = "Tesseract.js OCR (image)";
    }

    S.upload.stageIdx=3; S.upload.stageLabel="Extracting Fields"; S.upload.progress=97; render();
    await sleep(300);

    if(!rawText){ throw new Error("No readable text could be found in this document. Try a clearer scan, or use Demo Scenario mode."); }

    const parsed = parseFieldsFromText(rawText, baseline);
    S.realOcr = { fileName:file.name, rawText:rawText, confidence:parsed.confidence, engine:engine, avgConfidence:parsed.avgConfidence };
    S.fields = parsed.fields;
    S.ocrSource = "real";
    S.demoScenario = null;
    S.validation = null;

    S.upload.stageIdx=4; S.upload.stageLabel="Completed"; S.upload.progress=100; render();
    logAudit("Uploaded Document", file.name+" uploaded and processed via "+engine);
    await sleep(600);
    S.upload = { fileName:"", file:null, stageIdx:-1, progress:0, stageLabel:"", running:false, error:"", dragOver:false, timers:[] };
    goTo("ocr");
  } catch(err){
    clearUploadTimers();
    S.upload.running=false; S.upload.stageIdx=-1; S.upload.progress=0;
    S.upload.error = (err && err.message) ? err.message : "Something went wrong while processing this document.";
    render();
    showToast("Processing failed — see details on the upload page.","error");
  }
}

/* =======================================================================
   VALIDATION LOGIC + PAGE
   Validates whatever is currently in S.fields — real OCR output or demo
   scenario output — against the live RECORDS registry. No hard-coded
   demo answers are used here.
======================================================================= */
function findRegistryMatch(fields){
  if(!fields.surveyNumber) return null;
  const sn = fields.surveyNumber.trim().toLowerCase();
  if(!sn) return null;
  return RECORDS.find(function(r){
    if(!r.surveyNumber) return false;
    const sameSurvey = r.surveyNumber.trim().toLowerCase()===sn;
    const sameVillage = !fields.village || !r.village || r.village.trim().toLowerCase()===fields.village.trim().toLowerCase();
    return sameSurvey && sameVillage;
  }) || null;
}
function computeValidation(fields){
  const match = findRegistryMatch(fields);
  const issues=[];
  const rows = Object.keys(FIELD_LABELS).map(function(key){
    const extracted = (fields[key]||"").trim();
    const missing = extracted==="";
    if(!match){
      if(missing) issues.push({type:"Missing Information", field:FIELD_LABELS[key], detail:FIELD_LABELS[key]+" was not detected in the document."});
      return {key:key, extracted:extracted, db:"", missing:missing, status:missing?"missing":"new"};
    }
    const db = match[key]!==undefined ? String(match[key]) : "";
    const hasDb = db!=="";
    const isMatch = !missing && hasDb && extracted.toLowerCase()===db.toLowerCase();
    let status;
    if(missing){ status="missing"; issues.push({type:"Missing Information", field:FIELD_LABELS[key], detail:FIELD_LABELS[key]+" was not detected in the document."}); }
    else if(!hasDb){ status="new"; }
    else if(isMatch){ status="match"; }
    else {
      status="mismatch";
      if(key==="ownerName") issues.push({type:"Owner Mismatch", field:FIELD_LABELS[key], detail:'Extracted owner "'+extracted+'" differs from registry owner "'+db+'".'});
      else if(key==="surveyNumber") issues.push({type:"Survey Number Issue", field:FIELD_LABELS[key], detail:'Survey number "'+extracted+'" could not be matched to registry "'+db+'".'});
      else if(key==="landArea") issues.push({type:"Land Area Mismatch", field:FIELD_LABELS[key], detail:'Extracted area "'+extracted+'" does not match registry area "'+db+'".'});
      else issues.push({type:"Field Mismatch", field:FIELD_LABELS[key], detail:'"'+extracted+'" does not match registry value "'+db+'".'});
    }
    return {key:key, extracted:extracted, db:db, missing:missing, status:status};
  });

  let overall, status;
  if(match){
    const comparable = rows.filter(function(r){return r.db!=="";});
    const matchCount = rows.filter(function(r){return r.status==="match";}).length;
    overall = comparable.length ? Math.round((matchCount/comparable.length)*100) : 0;
    status = issues.length===0 ? "Verified" : (overall>=90 ? "Verified" : "Manual Verification");
  } else {
    const ocrAvg = currentAvgConfidence();
    const completeness = rows.filter(function(r){return !r.missing;}).length / rows.length;
    overall = Math.round(0.55*ocrAvg + 0.45*completeness*100);
    status = (issues.length===0 && overall>=90) ? "Verified" : "Manual Verification";
  }
  return {rows:rows, issues:issues, overall:overall, status:status, matchRecord:match};
}

          '<div><p class="small" style="font-weight:700;margin:0;">'+result.overall+'% match confidence</p><p class="small muted" style="margin:0;">'+(result.issues.length===0?"No issues detected":result.issues.length+" issue"+(result.issues.length>1?"s":"")+" found")+'</p></div>'+

        (dupes.length>0 ? '<div class="flex gap-2 small" style="border:1px solid var(--orange-200);background:var(--orange-50);color:#c2410c;border-radius:8px;padding:10px;margin-top:12px;">'+icon("copy")+' Potential duplicate of '+dupes.map(function(d){return d.id;}).join(", ")+'</div>' : '')+

function runValidationCheck(){
  const result = computeValidation(S.fields);
  const dupes = RECORDS.filter(function(r){
    return r.surveyNumber===S.fields.surveyNumber && r.village===S.fields.village && (!result.matchRecord || r.id!==result.matchRecord.id);
  });
  showToast("Running validation checks…","info");
  setTimeout(function(){
    S.validation = result; S.dupes = dupes;
    logAudit("Ran Validation", "Validation completed for "+currentFileName()+" — "+result.overall+"% confidence");
    goTo("validation-result");
  }, 900);
}
window.runValidationCheck = runValidationCheck;

        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;" class="summary-grid">'+
          [["Owner",S.fields.ownerName],["Survey No.",S.fields.surveyNumber],["Land Area",S.fields.landArea],["Village",S.fields.village],["District",S.fields.district],["State",S.fields.state],["Land Type",S.fields.landType]].map(function(x){
            return '<div><p class="small muted" style="margin:0;">'+x[0]+'</p><p style="font-weight:700;font-size:12.5px;margin:0;">'+esc(x[1]||"—")+'</p></div>';

function approveRecord(){
  const id = nextRecordId();
  const newRecord = Object.assign({id:id}, S.fields, {status:"Verified", confidence:(S.validation?S.validation.overall:98), uploadedDate:new Date().toISOString().slice(0,10)});
  RECORDS.unshift(newRecord);
  logAudit("Approved Record", id+" approved and stored ("+newRecord.confidence+"% confidence)");
  showToast(id+" approved and stored in the registry.","success");
  goTo("records");
}
function manualVerifyRecord(){
  const id = nextRecordId();
  const issueDetail = (S.validation && S.validation.issues[0]) ? S.validation.issues[0].detail : "Flagged for manual verification";
  const newRecord = Object.assign({id:id}, S.fields, {status:"Manual Verification", confidence:(S.validation?S.validation.overall:87), uploadedDate:new Date().toISOString().slice(0,10), issue:issueDetail});
  RECORDS.unshift(newRecord);
  logAudit("Manual Verification", id+" sent for manual verification");
  showToast(id+" sent for manual verification.","warning");
  goTo("errors");
}
function openRejectModal(){ S.modal={type:"confirmReject"}; render(); }
function confirmReject(){
  logAudit("Rejected Document", currentFileName()+" rejected during validation review");
  showToast("Document rejected. It was not added to the registry.","error");
  S.modal=null;
  goTo("upload");
}
window.approveRecord=approveRecord; window.manualVerifyRecord=manualVerifyRecord; window.openRejectModal=openRejectModal; window.confirmReject=confirmReject;

      '<td><span class="badge" style="background:var(--blue-50);border-color:var(--blue-100);color:var(--blue-700);">'+u.role+'</span></td>'+
      '<td class="muted">'+u.lastLogin+'</td>'+
      '<td><span class="flex items-center gap-1 small" style="color:'+(u.status==="Active"?"#059669":"var(--slate-400)")+';font-weight:600;"><span class="dot" style="background:'+(u.status==="Active"?"#10b981":"var(--slate-300)")+'"></span>'+u.status+'</span></td>'+
      '<td><button style="background:none;border:none;color:var(--blue-700);font-weight:700;font-size:12px;" onclick="toggleUserStatus(\''+u.id+'\')">'+(u.status==="Active"?"Deactivate":"Activate")+'</button></td></tr>';
    }).join('')+
  '</tbody></table></div></div>'+
  (S.modal && S.modal.type==="addUser" ? renderAddUserModal() : '');
}
function openAddUser(){ S.userForm={name:"",email:"",role:"Land Officer"}; S.modal={type:"addUser"}; render(); }
function closeModal(){ S.modal=null; render(); }
function setUserForm(key,val){ S.userForm[key]=val; render(); }
function submitAddUser(){
  if(!S.userForm.name || !S.userForm.email){ showToast("Please fill in name and email.","error"); return; }
  const id="U"+(USERS.length+1);
  USERS.push({id:id, name:S.userForm.name, email:S.userForm.email, role:S.userForm.role, status:"Active", lastLogin:"—"});
  logAudit("User Added", S.userForm.name+" added as "+S.userForm.role);
  showToast(S.userForm.name+" added as "+S.userForm.role+".","success");
  S.modal=null; render();
}
function toggleUserStatus(id){
  const u = USERS.find(function(x){return x.id===id;});
  if(u) u.status = u.status==="Active" ? "Inactive" : "Active";
  render();
}
window.openAddUser=openAddUser; window.closeModal=closeModal; window.setUserForm=setUserForm; window.submitAddUser=submitAddUser; window.toggleUserStatus=toggleUserStatus;

function renderAddUserModal(){
  const f = S.userForm;
  return '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box">'+
    '<div class="modal-head"><p style="font-weight:800;font-size:15px;margin:0;">New User</p><button style="background:none;border:none;color:var(--slate-400);" onclick="closeModal()">'+icon("x")+'</button></div>'+
    '<div class="modal-body">'+
      '<label class="field-label">Full name</label><input type="text" value="'+esc(f.name)+'" oninput="setUserForm(\'name\',this.value)" style="margin-bottom:12px;" placeholder="e.g. R. Kavitha"/>'+
      '<label class="field-label">Email address</label><input type="text" value="'+esc(f.email)+'" oninput="setUserForm(\'email\',this.value)" style="margin-bottom:12px;" placeholder="name@landrecords.gov.in"/>'+
      '<label class="field-label">Role</label><select class="field" onchange="setUserForm(\'role\',this.value)">'+
        ["Land Officer","Verifier","Admin"].map(function(r){return '<option '+(f.role===r?'selected':'')+'>'+r+'</option>';}).join('')+
      '</select>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitAddUser()">'+icon("check")+' Save User</button></div>'+
  '</div></div>';
}

/* =======================================================================
   AUDIT LOGS PAGE
======================================================================= */
function renderAudit(){
  const q = S.auditQuery;
  const filtered = AUDIT.filter(function(a){ return !q || (a.user+a.action+a.details).toLowerCase().includes(q.toLowerCase()); });
  return '<div class="section-head"><div><p class="eyebrow">Administration</p><h1 class="page-title">Audit Logs</h1><p class="page-sub">Chronological record of all portal activity.</p></div></div>'+
  '<div class="card" style="padding:14px;margin-bottom:16px;"><div class="search-box" style="display:flex;width:100%;">'+icon("search")+'<input type="text" value="'+esc(q)+'" oninput="setAuditQuery(this.value)" placeholder="Search by user, action, or record…"/></div></div>'+
  '<div class="card">'+
    (filtered.length ? filtered.map(function(a){
      return '<div class="flex gap-3" style="padding:16px 18px;border-bottom:1px solid var(--slate-100);">'+
      '<div style="width:34px;height:34px;border-radius:50%;background:var(--blue-50);color:var(--blue-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+icon("scroll")+'</div>'+
      '<div style="flex:1;min-width:0;"><div class="flex items-center justify-between" style="flex-wrap:wrap;gap:6px;"><p style="margin:0;font-weight:700;font-size:13px;">'+a.action+'</p><p class="small muted" style="margin:0;">'+a.timestamp+'</p></div>'+
      '<p class="small muted" style="margin:2px 0 0;">'+esc(a.details)+'</p><p class="small" style="margin:3px 0 0;font-weight:700;color:var(--blue-600);">'+esc(a.user)+'</p></div></div>';
    }).join('') : '<p class="muted" style="text-align:center;padding:40px;">No matching activity.</p>')+
  '</div>';
}
function setAuditQuery(v){ S.auditQuery=v; render(); }
window.setAuditQuery = setAuditQuery;

/* =======================================================================
   SETTINGS PAGE
======================================================================= */
function renderSettings(){
  const u = S.auth;
  return '<div class="section-head"><div><p class="eyebrow">Administration</p><h1 class="page-title">Settings</h1><p class="page-sub">Manage your profile, notifications, and system preferences.</p></div></div>'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;" class="settings-grid">'+
    '<div class="card" style="padding:24px;">'+
      '<p style="font-weight:700;font-size:14px;margin:0 0 16px;">Profile</p>'+
      '<div class="flex items-center gap-3"><div class="avatar" style="width:52px;height:52px;font-size:16px;">'+initials(u.name)+'</div>'+
      '<div><p style="font-weight:800;font-size:14px;margin:0;">'+esc(u.name)+'</p><p class="small muted" style="margin:0;">'+esc(u.email)+'</p>'+
      '<span class="badge" style="background:var(--blue-50);border-color:var(--blue-100);color:var(--blue-700);margin-top:4px;">'+u.role+'</span></div></div>'+
      '<p style="font-weight:700;font-size:14px;margin:22px 0 12px;">Notification Preferences</p>'+
      [["email","Email me when a record needs manual verification"],["sms","SMS alerts for critical validation errors"],["weeklyReport","Weekly digitization summary report"]].map(function(n){
        return '<label class="checkline" style="margin-bottom:8px;">'+n[1]+'<input type="checkbox" '+(S.notify[n[0]]?'checked':'')+' onchange="toggleNotify(\''+n[0]+'\')" style="accent-color:#1d4ed8;width:16px;height:16px;"/></label>';
      }).join('')+
    '</div>'+
    '<div>'+
      '<div class="card" style="padding:24px;margin-bottom:16px;">'+
        '<p style="font-weight:700;font-size:14px;margin:0 0 4px;">Validation Threshold</p><p class="small muted" style="margin:0 0 14px;">Minimum match confidence required for automatic approval.</p>'+
        '<input type="range" min="60" max="100" value="'+S.threshold+'" oninput="setThreshold(this.value)" style="width:100%;accent-color:#1d4ed8;"/>'+
        '<div class="flex items-center justify-between small muted" style="margin-top:6px;"><span>60%</span><span style="font-weight:800;font-size:14px;color:var(--blue-700);">'+S.threshold+'%</span><span>100%</span></div>'+
        '<button class="btn btn-secondary" style="margin-top:14px;" onclick="showToast(\'Validation threshold set to '+S.threshold+'%.\',\'success\')">'+icon("check")+' Save Threshold</button>'+
      '</div>'+
      '<div class="card" style="padding:24px;">'+
        '<p class="flex items-center gap-2" style="font-weight:700;font-size:14px;margin:0 0 16px;">'+icon("key")+' Change Password</p>'+
        '<form onsubmit="submitPasswordChange(event)">'+
          '<input type="password" id="pwCurrent" placeholder="Current password" style="margin-bottom:10px;"/>'+
          '<input type="password" id="pwNext" placeholder="New password" style="margin-bottom:10px;"/>'+
          '<input type="password" id="pwConfirm" placeholder="Confirm new password" style="margin-bottom:14px;"/>'+
          '<button type="submit" class="btn btn-primary btn-block">Update Password</button>'+
        '</form>'+
      '</div>'+
    '</div>'+
  '</div>'+
  '<style>@media(max-width:900px){.settings-grid{grid-template-columns:1fr !important;}}</style>';
}
function toggleNotify(key){ S.notify[key]=!S.notify[key]; render(); }
function setThreshold(v){ S.threshold=parseInt(v,10); render(); }
function submitPasswordChange(e){
  e.preventDefault();
  const cur=document.getElementById("pwCurrent").value, next=document.getElementById("pwNext").value, conf=document.getElementById("pwConfirm").value;
  if(!cur || !next || next!==conf){ showToast("Please check the password fields and try again.","error"); return; }
  showToast("Password updated successfully.","success");
  render();
}
window.toggleNotify=toggleNotify; window.setThreshold=setThreshold; window.submitPasswordChange=submitPasswordChange;

/* =======================================================================
   MODALS / TOASTS
======================================================================= */
function renderRejectModal(){
  return '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box">'+
    '<div class="modal-head"><p style="font-weight:800;font-size:15px;margin:0;">Reject this document?</p><button style="background:none;border:none;color:var(--slate-400);" onclick="closeModal()">'+icon("x")+'</button></div>'+
    '<div class="modal-body"><p class="small" style="color:var(--slate-600);line-height:1.6;margin:0;">This document will not be added to the registry, and you will need to re-upload it from scratch. This action cannot be undone.</p></div>'+
    '<div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="background:#dc2626;" onclick="confirmReject()">'+icon("xcircle")+' Reject Document</button></div>'+
  '</div></div>';
}
function renderToasts(){
  if(!S.toasts.length) return '';
  return '<div class="toast-wrap">'+S.toasts.map(function(t){
    const iconName = t.tone==="success"?"checkcircle":t.tone==="warning"?"alerttriangle":t.tone==="error"?"xcircle":"info";
    return '<div class="toast toast-'+t.tone+'">'+icon(iconName)+esc(t.message)+'</div>';
  }).join('')+'</div>';
}

/* =======================================================================
   MAIN RENDER
======================================================================= */
function pageContent(){
  switch(S.page){
    case "upload": return renderUpload();
    case "ocr": return renderOcr();
    case "validation": return renderValidation();
    case "validation-result": return renderValidationResult();
    case "records": return renderRecords();
    case "record-details": return renderRecordDetails();
    case "errors": return renderErrors();
    case "reports": return renderReports();
    case "users": return renderUsers();
    case "audit": return renderAudit();
    case "settings": return renderSettings();
    default: return renderDashboard();
  }
}
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = (active && typeof active.selectionStart==="number") ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd==="number") ? active.selectionEnd : null;

  const app = document.getElementById("app");
  if(!S.auth){
    app.innerHTML = (S.page==="login" ? renderLogin() : renderLanding()) + renderToasts();
  } else {
    app.innerHTML = '<div class="shell">'+renderSidebar()+
      '<div class="main-col">'+renderTopbar()+'<main class="main-content fade-in">'+pageContent()+
      (S.modal && S.modal.type==="confirmReject" ? renderRejectModal() : '')+
      '</main></div></div>'+renderToasts();
    if(S.page==="dashboard") buildDashboardCharts();
    if(S.page==="reports") buildReportsCharts();
  }

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

render();
</script>
</body>
</html>
